# Copy examples/vcs/ to /data2/<user>/<project>/vcs, then replace
# /data2/<user>/<project> before submitting.
apiVersion: batch/v1
kind: Job
metadata:
  name: vcs-counter
  namespace: synopsys
spec:
  backoffLimit: 0
  template:
    spec:
      schedulerName: kai-scheduler
      restartPolicy: Never
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        supplementalGroups: [1003]
      volumes:
        - name: data2
          hostPath:
            path: /data2
            type: Directory
      containers:
        - name: vcs
          image: local.io/synopsys/vcs:2025.06-SP1
          env:
            - name: SNPSLMD_LICENSE_FILE
              value: 2700@license
            - name: LM_LICENSE_FILE
              value: 2700@license
          command: ["bash", "-lc", "sh ./run.sh"]
          workingDir: /data2/<user>/<project>/vcs
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: data2
              mountPath: /data2
